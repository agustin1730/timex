"$schema" = "../gen/schemas/schema.json"

[default]
description = "Permite controlar la sesión Android de Time X desde la notificación."
permissions = ["allow-start", "allow-control", "allow-state", "allow-stop"]

[allow-start]
description = "Inicia el servicio de primer plano del temporizador."
commands.allow = ["start"]

[allow-control]
description = "Pausa, reanuda o salta la sesión Android."
commands.allow = ["control"]

[allow-state]
description = "Lee el estado de la sesión Android."
commands.allow = ["state"]

[allow-stop]
description = "Detiene el servicio de primer plano."
commands.allow = ["stop"]
