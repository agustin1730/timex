name: Build Time X for Windows

on:
  push:
    branches:
      - codex/json-timer-import-export-0.24.0
      - codex/windows-widget-notifications-0.28.0
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install dependencies
        run: npm ci
      - name: Check and build frontend
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run build
      - name: Test native session
        working-directory: src-tauri
        run: cargo test --release
      - name: Build Windows installer
        run: npm run desktop:build
      - uses: actions/upload-artifact@v4
        with:
          name: Time-X-Windows-installer
          path: src-tauri/target/release/bundle/nsis/Time X_*_x64-setup.exe
          if-no-files-found: error
