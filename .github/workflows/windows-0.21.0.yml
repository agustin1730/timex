name: Build Intervalos for Windows

on:
  push:
    branches:
      - codex/stage-colors-windows-0.21.0
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install dependencies
        run: npm ci
      - name: Verify code
        run: |
          npm run typecheck
          npm test
          npm run lint
      - name: Build Windows installer
        run: npm run desktop:build
      - uses: actions/upload-artifact@v4
        with:
          name: Intervalos-0.21.0-Windows
          path: src-tauri/target/release/bundle/nsis/Intervalos_0.21.0_x64-setup.exe
          if-no-files-found: error
